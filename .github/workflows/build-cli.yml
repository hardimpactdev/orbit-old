name: Build and Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-phar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, json
          tools: composer:v2
          ini-values: phar.readonly=0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Install CLI dependencies
        run: |
          cd packages/cli
          jq '.repositories = [{"type": "path", "url": "../core", "options": {"symlink": false}}]' composer.json > composer.tmp && mv composer.tmp composer.json
          rm -f composer.lock
          composer install --no-dev --no-scripts --optimize-autoloader --prefer-dist

      - name: Set version in CLI config
        run: |
          cd packages/cli
          sed -i "s/'version' => '[^']*'/'version' => '${{ steps.version.outputs.version }}'/g" config/app.php

      - name: Download Box
        run: |
          wget -q https://github.com/box-project/box/releases/download/4.6.2/box.phar
          chmod +x box.phar

      - name: Compile PHAR
        run: |
          cd packages/cli
          php ../../box.phar compile

      - name: Verify PHAR
        run: |
          cd packages/cli
          test -f builds/orbit.phar || (echo "PHAR not found!" && exit 1)
          FILESIZE=$(stat -c%s builds/orbit.phar)
          echo "PHAR size: $FILESIZE bytes"
          test $FILESIZE -gt 100000 || (echo "PHAR too small!" && exit 1)
          php builds/orbit.phar --version

      - name: Upload PHAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: orbit-phar
          path: packages/cli/builds/orbit.phar
          retention-days: 1

  build-static:
    needs: build-phar
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            spc_arch: linux-x86_64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            spc_arch: linux-aarch64
          - target: macos-aarch64
            runner: macos-15
            spc_arch: macos-aarch64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Download PHAR artifact
        uses: actions/download-artifact@v4
        with:
          name: orbit-phar

      - name: Download spc
        run: |
          curl -fsSL -o spc "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/spc-${{ matrix.spc_arch }}"
          chmod +x spc

      - name: Check build environment
        run: ./spc doctor --auto-fix

      - name: Download PHP and extension sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./spc download \
            --with-php=8.4 \
            --for-extensions="bcmath,ctype,curl,dom,fileinfo,filter,iconv,mbstring,mbregex,openssl,pcntl,pdo,pdo_sqlite,phar,posix,readline,simplexml,sockets,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib,sodium" \
            --prefer-pre-built

      - name: Build micro.sfx
        run: |
          ./spc build \
            "bcmath,ctype,curl,dom,fileinfo,filter,iconv,mbstring,mbregex,openssl,pcntl,pdo,pdo_sqlite,phar,posix,readline,simplexml,sockets,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib,sodium" \
            --build-micro \
            --with-micro-fake-cli

      - name: Combine into static binary
        run: |
          ./spc micro:combine orbit.phar \
            -I "memory_limit=512M" \
            --output orbit-${{ matrix.target }}
          chmod +x orbit-${{ matrix.target }}

      - name: Verify binary
        run: |
          ls -lh orbit-${{ matrix.target }}
          file orbit-${{ matrix.target }}
          ./orbit-${{ matrix.target }} --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: orbit-${{ matrix.target }}
          path: orbit-${{ matrix.target }}
          retention-days: 1

  release:
    needs: [build-phar, build-static]
    if: always() && needs.build-phar.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Collect available assets
        id: assets
        run: |
          FILES=""
          for name in orbit-linux-x86_64 orbit-linux-aarch64 orbit-macos-aarch64; do
            if [ -f "$name/$name" ]; then
              cd "$name" && sha256sum "$name" >> ../checksums.txt && cd ..
              FILES="$FILES $name/$name"
            fi
          done
          echo "files=$FILES checksums.txt" >> $GITHUB_OUTPUT
          echo "Available assets:$FILES"
          cat checksums.txt

      - name: Create release on orbit-cli repo
        env:
          GH_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$VERSION" \
            --repo hardimpactdev/orbit-cli \
            --title "Orbit $VERSION" \
            --generate-notes \
            ${{ steps.assets.outputs.files }}

      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sleep 5
          echo "Checking release assets..."
          gh api repos/hardimpactdev/orbit-cli/releases/tags/$VERSION --jq '.assets[].name'
